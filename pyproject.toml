[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crowd-anomaly-detection"
version = "1.1.0"
description = "Optical-flow based crowd anomaly detection with a FastAPI backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23", "scipy>=1.9", "scikit-learn==1.7.2",
  "opencv-python-headless>=4.7", "joblib>=1.2", "matplotlib>=3.6",
  "tqdm>=4.64", "kagglehub>=0.3"
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=7.0", "httpx>=0.27", "jupyter"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
